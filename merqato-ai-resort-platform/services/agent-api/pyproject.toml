[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merqato-agent-api"
version = "0.1.0"
description = "MerQato AI Resort Website — FastAPI agent service running real CrewAI agents."
requires-python = ">=3.11,<3.12"
dependencies = [
    "crewai==1.15.1",
    "crewai-tools==1.15.1",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.10.1",
    "portalocker==2.7.0",
    "pywin32==311 ; sys_platform == 'win32'",
    "qdrant-client>=1.12,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "ruff==0.13.2",
    "mypy==1.14.1",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

services:
  - type: web
    name: merqato-agent-api
    runtime: docker
    rootDir: services/agent-api
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Runtime secrets: set these in the Render dashboard before deploy.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      # Optional local-embeddings override; keep OpenRouter fallback default.
      - key: KNOWLEDGE_EMBEDDING_PROVIDER
        value: fastembed
    healthCheckPath: /health
